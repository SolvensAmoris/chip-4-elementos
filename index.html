1 desplazado",precio:"$15"},{parte:"Placa pruebas + fuente 12V",para:"Alimentación driver + ESP32",precio:"$10"}];function Pf(e){if(e===0)return"#00ff88";if(e===1.41)return"#ff8c42";return"#ff4d4d"}function B(e){return e.toFixed(2)}function _v(e,n,t){if(t===0){if(e==="AGUA"&&n==="TIERRA"||e==="TIERRA"&&n==="AGUA")return{msg:"Lectura segura. Agua+Tierra conmutan sin consecuencias.",level:"ok"};return{msg:"Conmutación libre. Sin costo.",level:"ok"}}if(e==="FUEGO"&&n==="AGUA")return{msg:"Lectura con empuje, paga. Fuego dispersado por Agua.",level:"pay"};if(e==="AGUA"&&n==="FUEGO")return{msg:"Escritura contra bus. Paga 1.66, colisión.",level:"pay"};if(e==="FUEGO"&&n==="TIERRA")return{msg:"Escritura pagada. Fuego ancla en Tierra, costo 1.41",level:"pay"};if(e==="TIERRA"&&n==="FUEGO")return{msg:"Anclaje -> Empuje. Escritura iniciada, paga 1.41",level:"pay"};if(e==="AIRE")return{msg:"Reorientación. Clock desalineado, paga 1.41/1.66",level:"pay"};if(n==="AIRE")return{msg:"Sincronización. Necesita reorientar, paga.",level:"pay"};return{msg:`Conmutación costosa ${t}`,level:"pay"}}var Tf="IVlar, ya quedó V2. Tu sandbox + compilador + capa fonónica. Tierra 40, Aire 50, Agua 60, Fuego 80. Ahora el programa ya se escucha. Si metes Fuego sin Tierra te da DENY. Si metes mucho Fuego sin Aire, Eld sube y se hace caos. El orden ES el programa.",Cf="IVlar, ya quedó V3. Ya no es solo sandbox. Es ESP32 + piezo 40-80kHz + láser. Tierra 40 ancla, Fuego 80 escribe, Aire 50 enfría Eld, Agua 60 lee sin borrar. Si metes Fuego sin Tierra, DENY físico. Si metes mucho Fuego sin Aire, Eld >3 y se apaga para enfriar. El láser lee 11+/10- = 1, 10+/10- = 0. Costo total $70. Ya se puede armar en mesa.",Lf=`// V3 - ESP32 + Piezo + Láser 650nm
// Compilador en hardware - no es if en JS, es físico

const int PIN_PIEZO = 25;
const int PIN_LASER = 26;
const int PIN_FOTO = 34; // analógico fotodiodo

float norma = 64.00;
float eld = 0;
bool anclado = false;

void setup() {
  Serial.begin(115200);
  pinMode(PIN_PIEZO, OUTPUT);
  pinMode(PIN_LASER, OUTPUT);
  digitalWrite(PIN_LASER, HIGH); // láser siempre ON para lectura
}

void meterElemento(String el) {
  if (el == "Tierra") anclado = true;

  if (el == "Fuego" && !anclado) {
    Serial.println("DENY - Fuego sin Tierra");
    return; // NO suena. No hay empuje físico.
  }

  if (el == "Fuego") eld += 1.0;           // calienta
  if (el == "Aire")  eld = max(0.0, eld - 1.5); // enfría

  if (eld > 3.0) {
    Serial.println("CAOS - Mete AIRE. Thermal throttle 2s");
    delay(2000); // ESP32 se apaga para enfriar, como CPU real
    eld = 1.5;   // después de enfriar queda caliente
    return;
  }

  int freq = 0;
  if (el == "Tierra") freq = 40000; // 40kHz ancla
  if (el == "Aire")   freq = 50000; // 50kHz clock
  if (el == "Agua")   freq = 60000; // 60kHz bus lectura
  if (el == "Fuego")  freq = 80000; // 80kHz escritura

  tone(PIN_PIEZO, freq, 300); // 300ms vibración REAL ultrasónica
  Serial.printf("%s %dHz -> Eld %.2f Norma %.2f\\n", el.c_str(), freq, eld, norma);
  delay(400); // 100ms silencio entre pulsos
}

int leerLaser() {
  int valor = analogRead(PIN_FOTO);
  // 10+/10- = punto quieto centrado = 0
  // 11+/10- = vórtice + dominante desplazado derecha = 1
  // Agua = dispersión 4 puntitos = lectura sin borrar
  if (valor < 500) return 0; // centrado
  if (valor < 1500) return 1; // desplazado dominante
  return 2; // dispersión Agua
}

void loop() {
  // Ejemplo: Tierra,Fuego,Aire,Agua,Agua
  meterElemento("Tierra");
  meterElemento("Fuego");
  meterElemento("Aire");
  meterElemento("Agua");

// deducido del sandbox, no inventado

const FRECUENCIAS = {
  "Tierra": 40, // kHz - Anclaje -> 220Hz audible V2, 40000Hz real V3
  "Aire":   50, // kHz - Clock   -> 330Hz V2, 50000Hz V3
  "Agua":   60, // kHz - Bus     -> 440Hz V2, 60000Hz V3
  "Fuego":  80  // kHz - Escritura -> 660Hz V2, 80000Hz V3
};
const COMMUTADOR = {
  FUEGO: {FUEGO:0, AGUA:1.66, AIRE:1.41, TIERRA:1.41},
  AGUA:  {FUEGO:1.66, AGUA:0, AIRE:1.66, TIERRA:0},
  AIRE:  {FUEGO:1.41, AGUA:1.66, AIRE:0, TIERRA:1.41},
  TIERRA:{FUEGO:1.41, AGUA:0, AIRE:1.41, TIERRA:0}
};

let norma = 64.00;
let eld = 0;
let anclado = false;

function meterElemento(el, prev) {
  if (el === "Tierra") anclado = true;
  
  if (el === "Fuego" && !anclado) {
    return "DENY - Fuego sin Tierra. Empuje perdido, no hay anclaje. V3: ESP32 no hace tone()";
  }
  
  if (el === "Fuego") eld += 1.0; // calienta piezo real
  if (el === "Aire")  eld = Math.max(0, eld - 1.5); // enfría

  if (eld > 3.0) return "CAOS - Eld alto. V3: delay(2000) thermal throttle, láser caótico";

  let costo = COMMUTADOR[prev][el];
  norma -= costo * 0.5;

  // Cristal 4x4 V2+V3
  // Tierra: punto fijo blanco
  // Fuego: flecha roja → o ↑ si prev=AIRE
  // Aire: arco amarillo giro
  // Agua: dispersión azul 4 puntitos

  // V3 Láser 650nm lectura:
  // 0 = punto quieto centrado 10+/10-
  // 1 = desplazado derecha halo amarillo 11+/10-
  // Agua = 4 puntitos azules dispersión lectura sin borrar
  // Fotodiodo analogRead: <500=0, <1500=1, >1500=Agua

  return \`OK - \${prev} -> \${el} Costo \${costo} | Norma \${norma.toFixed(2)} | Eld \${eld.toFixed(2)} | Láser \${lectura}\`;
}

function reproducirPrograma(historial, modoV3) {
  historial.forEach((el, i) => {
    setTimeout(() => {
      let freqReal = FRECUENCIAS[el] * 1000; // 40kHz real ultrasónico V3
      let freqAudible = {Tierra:220, Aire:330, Agua:440, Fuego:660}[el]; // V2 demo
      if (modoV3) {
        vibrarPiezo(freqReal, 300); // 300ms vibración REAL
        // No suena, mira cristal 4x4 + láser
      } else {
        playTone(freqAudible, 300); // 300ms tono audible demo
      }
      pintarCristal(el, i);
      leerLaser(); // V3: fotodiodo 0/1/Agua
    }, i * 400);
  });
}

// Copiar tal cual a Arduino IDE

const int PIN_PIEZO = 25;
const int PIN_FOTO = 34;
float norma=64.00; float eld=0; bool anclado=false;

void meterElemento(String el) {
  if (el=="Tierra") anclado=true;
  if (el=="Fuego" && !anclado) {
    Serial.println("DENY - Fuego sin Tierra");
    // Láser parpadea rojo en sandbox
    return;
  }
  if (el=="Fuego") eld+=1.0;
  if (el=="Aire") eld=max(0.0, eld-1.5);
  if (eld>3.0) {
    Serial.println("CAOS - Mete AIRE - Throttle 2s");
    delay(2000); // thermal throttle físico
    eld=1.5;
    return;
  }
  int freq=0;
  if (el=="Tierra") freq=40000;
  if (el=="Aire") freq=50000;
  if (el=="Agua") freq=60000;
  if (el=="Fuego") freq=80000;
  tone(PIN_PIEZO, freq, 300);
  delay(400);
}

int leerLaser() {
  int v=analogRead(PIN_FOTO);
  // v<500 = 0 quieto centrado 10+/10-
  // v<1500 = 1 desplazado dominante 11+/10-
  // v>=1500 = Agua dispersión 4 pts
  return v<500?0:v<1500?1:2;
}
